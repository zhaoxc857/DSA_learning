[package]
name = "dsa-learning"
version = "1.0.0"
description = "数据结构与算法 · 互动自学学院原生桌面端"
authors = ["DSA Learning"]
edition = "2021"

[lib]
name = "dsa_learning_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
opt-level = "s"
